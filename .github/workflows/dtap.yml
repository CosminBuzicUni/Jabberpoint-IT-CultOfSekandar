name: DTAP Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Compile and create jar
        run: |
          mkdir -p out
          javac -d out $(find src -name "*.java")
          jar cfe JabberPoint.jar jabberpoint.JabberPoint -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: JabberPoint.jar

  test:
      runs-on: ubuntu-latest

      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'

        - name: Make Gradle wrapper executable
          run: chmod +x ./gradlew

        - name: Run tests and coverage
          run: ./gradlew clean test jacocoTestReport --no-daemon

        - name: Upload JUnit results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: junit-results
            path: build/test-results/test

        - name: Upload JaCoCo reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-reports
            path: build/reports/jacoco/test

  acceptance:
    needs: test
    runs-on: ubuntu-latest
    environment: acceptance

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Acceptance step
        run: echo "Acceptance approved"

  production:
    needs: acceptance
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Production deploy
        run: echo "Production deployment done"